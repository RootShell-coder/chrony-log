apiVersion: v1
kind: Namespace
metadata:
  name: chrony
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chrony
  namespace: chrony
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: chrony
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chrony
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.io/hostname: ntp-node
      securityContext:
        sysctls:
          - name: net.ipv4.ip_unprivileged_port_start
            value: "123"
      containers:
        - name: chrony
          image: ghcr.io/rootshell-coder/chrony-log:latest
          imagePullPolicy: Always
          env:
            - name: NTP_POOLS
              value: pool.ntp.org
            - name: NTP_SERVERS
              value: ""
            - name: LOG_TIME_OFFSET
              value: "+0000"
            - name: ALLOW_CIDR
              value: 192.168.0.0/24
          securityContext:
            runAsUser: 100
            runAsGroup: 101
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: ntp
              containerPort: 123
              protocol: UDP
          volumeMounts:
            - name: runtime
              mountPath: /tmp
          resources:
            requests:
              cpu: 20m
              memory: 16Mi
            limits:
              cpu: 500m
              memory: 64Mi
          readinessProbe:
            exec:
              command: [/usr/bin/chronyc, -h, /tmp/chrony/chronyd.sock, waitsync, "1"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: runtime
          emptyDir:
            medium: Memory
            sizeLimit: 8Mi
---
apiVersion: v1
kind: Service
metadata:
  name: chrony
  namespace: chrony
spec:
  type: ClusterIP
  externalIPs:
    - 192.168.0.10
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: chrony
  ports:
    - name: ntp
      port: 123
      targetPort: ntp
      protocol: UDP
