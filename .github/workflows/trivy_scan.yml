name: Trivy Security Scan

on:
  workflow_run:
    workflows: [Docker image]
    types: [completed]

concurrency:
  group: trivy-report-${{ github.event.repository.default_branch }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/rootshell-coder/chrony-log
  TRIVY_IMAGE: ghcr.io/rootshell-coder/trivy-cached:latest

jobs:
  trivy-scan:
    name: Scan published image
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      packages: read
    steps:
      - name: Check out default branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull published image
        run: docker pull "${IMAGE_NAME}:latest"
      - name: Scan image and create report
        run: |
          docker save "${IMAGE_NAME}:latest" -o image.tar
          chmod 0644 image.tar
          docker run --rm \
            --volume "${PWD}/image.tar:/scan/image.tar:ro" \
            "${TRIVY_IMAGE}" image --input /scan/image.tar --skip-db-update \
            --format table > SECURITY.txt
      - name: Upload security report
        uses: actions/upload-artifact@v7
        with:
          name: chrony-log-security
          path: SECURITY.txt
          if-no-files-found: error
          retention-days: 30
      - name: Commit security report
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add -- SECURITY.txt
          if git diff --cached --quiet -- SECURITY.txt; then
            echo "Security report is unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Trivy security report [skip ci]"
          git pull --rebase origin "${TARGET_BRANCH}"
          git push origin "HEAD:${TARGET_BRANCH}"
