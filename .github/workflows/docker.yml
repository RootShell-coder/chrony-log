name: Docker image

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: rootshell-coder/chrony-log

jobs:
  image-smoke:
    name: Build and test image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build image with unit and backpressure tests
        uses: docker/build-push-action@v7
        with:
          context: docker
          platforms: linux/amd64
          load: true
          tags: chrony-log:latest
          cache-from: type=gha,scope=chrony-log-amd64
          cache-to: type=gha,mode=max,scope=chrony-log-amd64
      - name: Test NTP replies and JSON request logs
        run: |
          python docker/tests/config.py
          python docker/tests/smoke.py
          TEST_LOG_TIME_OFFSET=+0100 python docker/tests/smoke.py
          TEST_LOG_TIME_OFFSET=-0530 python docker/tests/smoke.py

  build:
    name: Publish multi-platform image
    needs: image-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: type=raw,value=latest
      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: docker
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=chrony-log-multi
          cache-to: type=gha,mode=max,scope=chrony-log-multi
          provenance: mode=max
          sbom: true
